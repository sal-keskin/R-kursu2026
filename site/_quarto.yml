  site-url: https://sal-keskin.github.io/R-kursu2026/
  repo-url: https://github.com/sal-keskin/R-kursu2026
  page-navigation: true
  reader-mode: false
  navbar:
    collapse-below: lg
    left:
      - text: "Oturum 1"
        menu:
          - text: "Oturuma genel bakış"
            href: oturum1.qmd
          - text: "Kodlar ve çıktıları"
            href: oturum1-kod.qmd
          - text: "Tarayıcıda deneyin"
            href: dene.qmd
          - text: "Oturumun verisi"
            href: veri-ht.qmd
          - text: "Ders kaydı"
            href: https://www.youtube.com/watch?v=cc22iYSFUmw&list=PLVqkPXX13dHk
            target: _blank
      - text: "Oturum 2"
        menu:
          - text: "Oturuma genel bakış"
            href: oturum2.qmd
          - text: "Kodlar ve çıktıları"
            href: oturum2-kod.qmd
          - text: "Tarayıcıda deneyin"
            href: oturum2-dene.qmd
          - text: "Ders kaydı"
            href: https://www.youtube.com/watch?v=824RjWL-aeQ&list=PLVqkPXX13dHk
            target: _blank
      - text: "Oturum 3"
        menu:
          - text: "Oturuma genel bakış"
            href: oturum3.qmd
          - text: "Kodlar ve çıktıları"
            href: oturum3-kod.qmd
          - text: "Tarayıcıda deneyin"
            href: oturum3-dene.qmd
