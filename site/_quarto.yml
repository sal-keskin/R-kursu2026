    right: "Salih Keskin · Saadet Göksu Çelik Pekerşen"

format:
  html:
    theme:
      light: [cosmo, styles/acik.scss]
      dark: [cosmo, styles/koyu.scss]
    respect-user-color-scheme: true
    css: styles/site.css
    include-after-body: styles/tema-dugmesi.html
    template-partials:
      - sablon/title-block.html
    highlight-style:
      light: github
      dark: github-dark
    toc: true
    toc-title: "Bu sayfada"
    toc-depth: 2
    page-layout: article
    grid:
      body-width: 860px
      margin-width: 260px
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true
    smooth-scroll: true
    anchor-sections: true

execute:
  echo: true
  warning: false
  message: false
  freeze: false

knitr:
  opts_chunk:
    comment: "#>"
    fig.align: center
    dev: svglite
