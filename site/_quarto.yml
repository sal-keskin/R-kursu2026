project:
  type: website
  output-dir: _site
  # Derlemeden önce veri ve script'ler site klasörüne kopyalanır (bkz. _hazirla.R)
  pre-render: _hazirla.R
  render:
    - "*.qmd"
  resources:
    - veri/
    - indir/

lang: tr

website:
