# Her push'ta Quarto sitesini derler ve GitHub Pages'e yayınlar.
# R kodu (Oturum 1 script'i ve Veriler sayfası) derleme sırasında gerçekten çalıştırılır;
# script hata verirse site yayınlanmaz, eski sürüm yayında kalır.
name: Siteyi derle ve yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  derle:
    runs-on: ubuntu-latest
    env:
      LANG: tr_TR.UTF-8
    steps:
      - uses: actions/checkout@v7

      - name: Türkçe yerel ayar ve Tcl/Tk (summarytools için)
        run: |
          sudo locale-gen tr_TR.UTF-8
          sudo update-locale
          sudo apt-get update -qq
          sudo apt-get install -y -qq libtcl8.6 libtk8.6

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.19

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown
            any::htmltools
            any::readxl
            any::readr
            any::haven
            any::dplyr
            any::tidyr
            any::ggplot2
            any::summarytools
            any::datawizard
            any::naniar
            any::gt
            any::gtExtras
            any::svglite
            any::patchwork

      - name: Siteyi derle
        run: quarto render site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/_site

  yayinla:
    needs: derle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - id: yayin
        uses: actions/deploy-pages@v5
